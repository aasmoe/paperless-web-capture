<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Paperless Capture</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>📄 Paperless Capture</h1>

    <div id="status" class="status"></div>
    
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="form-group">
        <label for="serverUrl">Paperless Server URL</label>
        <input type="text" id="serverUrl" class="input" placeholder="https://paperless.example.com" />
        <small>API token is in "My Profile"</small>
      </div>
      <div class="form-group">
        <label for="apiToken">API Token</label>
        <input type="password" id="apiToken" class="input" placeholder="Your API token" />
      </div>
      <div class="button-group">
        <button id="saveSettingsBtn" class="btn btn-primary">Connect</button>
        <button id="cancelSettingsBtn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>

    <div id="captureSection">
      <button id="captureBtn" class="btn btn-primary">
        Send Page to Paperless
      </button>
      
      <div class="footer">
        <a href="#" id="toggleSettingsLink">⚙️ Edit settings</a>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
